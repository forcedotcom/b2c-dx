name: Validate release PR

# Independent, gating re-verification of a release PR. This is the check a
# reviewer (and branch protection) can rely on: it does NOT trust the receiver's
# earlier verification — it re-reads the committed releases/<version>.json marker,
# re-downloads the VSIX from the allowlisted monorepo, and re-verifies the SHA-256
# and SLSA build provenance from scratch. It also confirms the marker is
# internally consistent (version/tag/sha shape).
#
# Two triggers:
#   * workflow_dispatch — the primary path. receive-monorepo-release.yml opens the
#     PR with GITHUB_TOKEN, and GitHub's recursion guard suppresses the
#     pull_request event for such PRs, so the receiver explicitly dispatches this
#     workflow (workflow_dispatch is exempt from the guard).
#   * pull_request — defense in depth: if a human pushes to a release branch (a
#     real event, not GITHUB_TOKEN), this fires on its own and re-gates the PR.

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: 'Release branch under validation (e.g. release/b2c-vs-extension-0.10.1)'
        required: true
        type: string
      version:
        description: 'Version being released (e.g. 0.10.1)'
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - 'releases/**'
      - 'CHANGELOG.md'

permissions:
  contents: read

concurrency:
  group: validate-release-pr-${{ github.event.inputs.release_branch || github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Re-verify release artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read # read the committed marker + download the release asset
      checks: write # post the validate-release-pr check-run onto the PR head
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Allowlisted source repo — same source of truth as the receiver. Overridable
      # via repo variable for sandbox testing; falls back to the production monorepo.
      EXPECTED_MONOREPO: ${{ vars.EXPECTED_MONOREPO || 'SalesforceCommerceCloud/b2c-developer-tooling' }}
      THIS_REPO: ${{ github.repository }}
      EVENT_NAME: ${{ github.event_name }}
      # Untrusted-ish inputs — bound to env, validated before use, never inlined.
      IN_BRANCH: ${{ github.event.inputs.release_branch }}
      IN_VERSION: ${{ github.event.inputs.version }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
      # The PR's base branch (usually main). Used to tell a release PR apart from
      # a general PR: a release PR sets releases/latest.json.version to a new,
      # non-null semver relative to base; a general PR leaves it null/unchanged.
      PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
    steps:
      - name: Resolve ref to validate
        id: ref
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "checkout=$PR_HEAD_SHA" >> "$GITHUB_OUTPUT"
          else
            # Validate the dispatched branch name shape before using it as a ref.
            echo "$IN_BRANCH" | grep -Eq '^release/b2c-vs-extension-[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
              || { echo "::error::release_branch '$IN_BRANCH' has an unexpected shape"; exit 1; }
            echo "checkout=$IN_BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.ref.outputs.checkout }}
          # Need history so a pull_request run can read releases/latest.json on the
          # base branch and compare it to the head (release-PR detection below).
          fetch-depth: 0

      # Classify the PR before doing any verification work. This workflow's
      # pull_request trigger fires on ANY PR that touches releases/** or
      # CHANGELOG.md — but only a RELEASE PR should be gated. A release PR is the
      # one where releases/latest.json.version becomes a new, non-null semver
      # relative to the base branch (this is exactly the signal the receiver sets,
      # and the same one release-on-merge.yml keys off). A general PR (docs, CI,
      # or one that only edits the sentinel while version stays null/unchanged) is
      # NOT a release PR: we skip verification and post a NEUTRAL (non-blocking)
      # check so the PR is never wrongly marked red. workflow_dispatch always
      # means an explicit release validation, so it is never classified as a skip.
      - name: Classify PR (release vs general)
        id: classify
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "::notice::workflow_dispatch — treating as an explicit release validation."
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          HEAD_VERSION=$(jq -r '.version // empty' releases/latest.json 2>/dev/null || true)

          # Read the base branch's pointer for comparison. If releases/latest.json
          # does not exist on base yet, treat base version as empty.
          BASE_VERSION=$(git show "origin/${PR_BASE_REF}:releases/latest.json" 2>/dev/null \
            | jq -r '.version // empty' 2>/dev/null || true)

          if [ -z "$HEAD_VERSION" ]; then
            echo "::notice::releases/latest.json.version is null/absent on this PR (sentinel state) — not a release PR. Skipping."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$HEAD_VERSION" = "$BASE_VERSION" ]; then
            echo "::notice::releases/latest.json.version ('$HEAD_VERSION') is unchanged from base — not a release PR. Skipping."
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "::notice::Release PR detected: latest.json.version '$BASE_VERSION' -> '$HEAD_VERSION'."
          echo "is_release=true" >> "$GITHUB_OUTPUT"

      - name: Re-verify marker, artifact, and provenance
        id: verify
        if: steps.classify.outputs.is_release == 'true'
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          # The commit under validation = the PR head; the check-run attaches here.
          HEAD_SHA=$(git rev-parse HEAD)
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"

          # Determine the version: trust the dispatched value on workflow_dispatch,
          # otherwise read it from the committed pointer for the pull_request path.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            VERSION=$(jq -r '.version // empty' releases/latest.json)
          else
            VERSION="$IN_VERSION"
          fi
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
            || fail "resolved version '$VERSION' is not valid semver"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          MARKER="releases/${VERSION}.json"
          [ -f "$MARKER" ] || fail "committed marker $MARKER is missing from this PR"

          MONOREPO_REPO=$(jq -r '.monorepoRepo // empty' "$MARKER")
          MONOREPO_TAG=$(jq -r '.monorepoTag // empty' "$MARKER")
          MARKER_SHA=$(jq -r '.vsixSha256 // empty' "$MARKER")

          # Allowlist + internal-consistency checks on the committed marker.
          [ "$MONOREPO_REPO" = "$EXPECTED_MONOREPO" ] \
            || fail "marker monorepoRepo '$MONOREPO_REPO' is not the allowlisted '$EXPECTED_MONOREPO'"
          [ "$MONOREPO_TAG" = "b2c-vs-extension@${VERSION}" ] \
            || fail "marker monorepoTag '$MONOREPO_TAG' does not match 'b2c-vs-extension@${VERSION}'"
          echo "$MARKER_SHA" | grep -Eq '^[a-f0-9]{64}$' \
            || fail "marker vsixSha256 is missing or malformed"

          # Re-download the VSIX from the allowlisted monorepo release.
          gh release download "$MONOREPO_TAG" \
            --repo "$MONOREPO_REPO" \
            --pattern '*.vsix' \
            --dir /tmp/vsix
          COUNT=$(ls /tmp/vsix/*.vsix 2>/dev/null | wc -l | tr -d ' ')
          [ "$COUNT" -eq 1 ] || fail "expected exactly one .vsix on ${MONOREPO_REPO}@${MONOREPO_TAG}, found $COUNT"
          VSIX=$(ls /tmp/vsix/*.vsix)

          # Re-verify integrity against the committed marker (independent of the
          # receiver's earlier check).
          ACTUAL_SHA=$(sha256sum "$VSIX" | awk '{print $1}')
          [ "$ACTUAL_SHA" = "$MARKER_SHA" ] \
            || fail "VSIX sha256 mismatch: marker=$MARKER_SHA actual=$ACTUAL_SHA"

          # Re-verify SLSA build provenance from scratch. Pins the workflow path and
          # the source ref, so only an artifact built + attested on the monorepo's
          # main branch passes.
          gh attestation verify "$VSIX" \
            --repo "$MONOREPO_REPO" \
            --signer-workflow "${MONOREPO_REPO}/.github/workflows/publish.yml" \
            --source-ref refs/heads/main

          echo "::notice::Independent re-verification passed for b2c-vs-extension@${VERSION} ($ACTUAL_SHA)"

      - name: Post validate-release-pr check-run
        if: always()
        env:
          IS_RELEASE: ${{ steps.classify.outputs.is_release }}
          CLASSIFY_RESULT: ${{ steps.classify.outcome }}
          HEAD_SHA: ${{ steps.verify.outputs.head_sha }}
          VERSION: ${{ steps.verify.outputs.version }}
          RESULT: ${{ steps.verify.outcome }}
        run: |
          set -euo pipefail
          # The check-run attaches to the PR head commit so it surfaces on the PR and
          # can be made a required status via branch protection. Falls back to the
          # current HEAD if the verify step was skipped or failed before emitting an output.
          SHA="${HEAD_SHA:-$(git rev-parse HEAD)}"

          # FAIL CLOSED on a classification failure. Classify decides whether this PR
          # is gated at all; if it did not finish cleanly (e.g. set -euo pipefail
          # tripped, or jq/`git show` errored), IS_RELEASE is empty. We must NOT then
          # fall through to the "not a release -> neutral" branch below: a neutral
          # conclusion is non-blocking, so a real release PR whose classifier crashed
          # would silently open the gate. When we cannot prove a PR is safe, we fail it.
          if [ "$CLASSIFY_RESULT" != "success" ]; then
            CONCLUSION="failure"
            TITLE="Could not classify PR — failing closed"
            SUMMARY="The classification step did not complete successfully, so we cannot determine whether this is a release PR. Failing closed (do not merge). See the workflow logs."
          elif [ "$IS_RELEASE" != "true" ]; then
            # Not a release PR — do not gate. NEUTRAL is non-blocking: it shows as a
            # grey "not applicable" tick, never a red failure, so general PRs pass.
            CONCLUSION="neutral"
            TITLE="Not a release PR — skipped"
            SUMMARY="This PR does not set releases/latest.json.version to a new release version, so no VSIX verification is required. (This check only gates release PRs opened by receive-monorepo-release.)"
          elif [ "$RESULT" = "success" ]; then
            CONCLUSION="success"
            TITLE="Independent re-verification passed"
            SUMMARY="Re-read the committed marker, re-downloaded the VSIX from the allowlisted monorepo, and re-verified SHA-256 + SLSA build provenance for v${VERSION}."
          else
            CONCLUSION="failure"
            TITLE="Independent re-verification failed"
            SUMMARY="Re-verification did not pass. Do not merge. See the workflow logs for the failing check."
          fi
          jq -n \
            --arg sha "$SHA" \
            --arg concl "$CONCLUSION" \
            --arg title "$TITLE" \
            --arg summary "$SUMMARY" \
            '{name:"validate-release-pr", head_sha:$sha, status:"completed", conclusion:$concl, output:{title:$title, summary:$summary}}' \
          | gh api "repos/${GITHUB_REPOSITORY}/check-runs" --method POST --input -
