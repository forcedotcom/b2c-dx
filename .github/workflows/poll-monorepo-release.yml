name: Poll monorepo for new VSIX release

# Pull-based trigger for the release pipeline — the credential-free alternative to
# the monorepo PUSHING a repository_dispatch (which needs a cross-repo GitHub App
# or PAT). Instead, THIS repo pulls: on a schedule (and on demand) it checks the
# monorepo's PUBLIC releases with its OWN GITHUB_TOKEN, and when it finds an
# extension release we haven't processed yet, it fires a repository_dispatch to
# ITSELF to wake receive-monorepo-release.yml — the exact same event the monorepo
# push would have sent, so the receiver runs one unchanged code path.
#
# Why this needs no new credentials:
#   * The monorepo's releases are public, so `gh release ...` uses only this repo's
#     GITHUB_TOKEN — no external/cross-repo credential, no enterprise approval.
#   * A repository_dispatch fired with GITHUB_TOKEN is EXEMPT from GitHub's
#     recursion guard, so it DOES trigger the receiver (most GITHUB_TOKEN-fired
#     events are suppressed; repository_dispatch and workflow_dispatch are not).
#
# Why it is safe that the "message" is untrusted:
#   * The dispatch payload only decides WHICH release to wake the receiver for.
#     The receiver re-downloads the VSIX and re-verifies sha256 + SLSA build
#     provenance from scratch and FAILS CLOSED. Trust comes from the attestation,
#     never from this poll.
#
# Idempotency — never re-raises a PR or re-publishes an already-handled release.
# The poll wakes the receiver for a version ONLY if it is genuinely new; it skips if:
#   * the release tag b2c-vs-extension@<version> already exists here (published), OR
#   * a release PR for this version is MERGED (accepted — publish already handled), OR
#   * a release PR for this version is OPEN (in flight), OR
#   * a release PR for this version was CLOSED without merging (a maintainer
#     declined it — we respect that and do not nag; reopen that PR to retry).
# The state is read from PERMANENT PR history, not branch existence, so deleting a
# release branch cannot cause a re-raise, and "closed after merge" (MERGED) is told
# apart from "closed without merging" (CLOSED).
# (Reinforced downstream: the receiver skips if the release exists and edits an
# existing PR rather than duplicating it; the publishers use --skip-duplicate.)

on:
  schedule:
    # Every 30 minutes, offset off the top of the hour — scheduled runs are
    # best-effort and :00 is the most contended (and most-delayed) slot.
    # Change to a single 'MM * * * *' for hourly.
    - cron: '9,39 * * * *'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional: force-check a specific version (e.g. 0.10.1). Leave empty to check the latest monorepo extension release.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: poll-monorepo-release
  cancel-in-progress: false

jobs:
  poll:
    name: Check monorepo for an unprocessed release
    runs-on: ubuntu-latest
    permissions:
      # contents: write is required by the POST /repos/{repo}/dispatches endpoint
      # (repository_dispatch). It is scoped to THIS repo only, the poll pushes
      # nothing, and neither trigger (schedule / workflow_dispatch) is reachable
      # from fork PRs — so this is not a fork-PR escalation vector.
      contents: write
      # pull-requests: read lets the idempotency guard query PR history via
      # `gh pr list` (GraphQL repository.pullRequests). Read-only: the poll never
      # opens or edits a PR — that is the receiver's job. Once an explicit
      # permissions: block is set, every unlisted scope defaults to none, so this
      # must be declared or the guard's PR query is denied.
      pull-requests: read
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Same allowlisted source as the receiver. Overridable via repo variable for
      # sandbox testing; falls back to the production monorepo.
      EXPECTED_MONOREPO: ${{ vars.EXPECTED_MONOREPO || 'SalesforceCommerceCloud/b2c-developer-tooling' }}
      THIS_REPO: ${{ github.repository }}
      # Untrusted-ish manual input — bound to env, validated before use, never
      # interpolated into a run: line.
      IN_VERSION: ${{ github.event.inputs.version }}
    steps:
      - name: Resolve target release from the monorepo
        id: resolve
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }

          if [ -n "${IN_VERSION:-}" ]; then
            # Manual fast-path: a specific version was requested. Validate its shape
            # before it is used to build a tag/ref.
            echo "$IN_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$' \
              || fail "input version '$IN_VERSION' is not valid semver"
            VERSION="$IN_VERSION"
            TAG="b2c-vs-extension@${VERSION}"
            # Confirm the release actually exists on the monorepo before waking the receiver.
            gh release view "$TAG" --repo "$EXPECTED_MONOREPO" >/dev/null 2>&1 \
              || fail "no release '$TAG' on $EXPECTED_MONOREPO"
          else
            # Scheduled path: pick the highest STABLE b2c-vs-extension version on the
            # monorepo — by SEMVER, not publish date. Date order is unreliable (a late
            # 0.9.5 hotfix cut after 0.10.1 would sort newest) and string order is
            # wrong (0.10.10 < 0.10.9). Prereleases (e.g. 0.10.2-beta.1) are excluded:
            # the marketplace path only promotes stable releases, and a lower already
            # released version is caught by the idempotency guard below anyway.
            #
            # Enumerate ALL releases via the paginated REST API, NOT a bounded
            # `gh release list --limit N`. That list returns only the newest N *by
            # publish date* (--order desc = createdAt), so on a busy monorepo the
            # true semver-max could sit just past the page boundary and be silently
            # dropped — reintroducing exactly the date-vs-semver trap noted above. By
            # paginating the complete set, ordering and truncation stop mattering:
            # we compute the max over every release. (REST uses tag_name, snake_case.)
            #
            # Fail closed: this runs under `set -euo pipefail`, so a `gh api` error
            # aborts the assignment rather than yielding an empty (falsely "no
            # releases") result. The two-stage pipe — page-stream of tag names, then
            # numeric semver-max — is order-independent by construction.
            VERSION=$(gh api "repos/${EXPECTED_MONOREPO}/releases?per_page=100" \
                --paginate --jq '.[].tag_name' \
              | jq -R -s -r '
                [ split("\n")[]
                  | select(test("^b2c-vs-extension@[0-9]+\\.[0-9]+\\.[0-9]+$"))
                  | sub("^b2c-vs-extension@";"") ]
                | if length == 0 then empty
                  else ( map(split(".") | map(tonumber)) | sort | last | map(tostring) | join(".") )
                  end')
            if [ -z "$VERSION" ]; then
              echo "::notice::No stable b2c-vs-extension release found on $EXPECTED_MONOREPO; nothing to do"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            TAG="b2c-vs-extension@${VERSION}"
          fi

          echo "::notice::Target monorepo extension release: $TAG"
          {
            echo "skip=false"
            echo "version=$VERSION"
            echo "tag=$TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Skip if already published or a release PR already exists
        id: guard
        if: steps.resolve.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          RELEASE_TAG="b2c-vs-extension@${VERSION}"
          BRANCH="release/b2c-vs-extension-${VERSION}"

          # (1) Already published in this repo? (Also covers a merged PR that has
          # already produced the release tag.)
          if gh release view "$RELEASE_TAG" --repo "$THIS_REPO" >/dev/null 2>&1; then
            echo "::notice::Release $RELEASE_TAG already exists in $THIS_REPO; skipping (already published)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # (2) Has a release PR for this version ever existed? Query PERMANENT PR
          # history for the exact release head branch — this survives branch
          # deletion (so deleting a branch cannot cause a re-raise) and lets us tell
          # MERGED apart from CLOSED-without-merge. Exact headRefName match avoids the
          # 0.10.1-vs-0.10.10 prefix collision a name `test()` would suffer.
          # --state all so closed/merged PRs are included, not just open ones.
          # Pipe to the system `jq` (NOT gh's built-in --jq, which rejects --arg)
          # so the exact-match binding via --arg works.
          PR_STATE=$(gh pr list --repo "$THIS_REPO" --head "$BRANCH" --state all \
            --json state,headRefName \
          | jq -r --arg b "$BRANCH" \
              'map(select(.headRefName == $b)) | if length == 0 then "NONE" else .[0].state end')

          case "$PR_STATE" in
            MERGED)
              # Accepted and merged — release-on-merge handles publishing. If the
              # release tag is missing that job is still in flight; do NOT re-wake.
              echo "::notice::Release PR for $RELEASE_TAG was MERGED; publish is handled on-merge. Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            OPEN)
              echo "::notice::Release PR for $RELEASE_TAG is OPEN (in flight); skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            CLOSED)
              # A maintainer closed it WITHOUT merging — an explicit decline. Respect
              # it: do not nag by re-raising every poll. To retry, reopen that PR (or
              # trigger this workflow manually for the version once policy allows).
              echo "::notice::Release PR for $RELEASE_TAG was CLOSED without merging (declined); skipping. Reopen the PR to retry."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit 0 ;;
            NONE)
              echo "::notice::$RELEASE_TAG is new (no release, no prior release PR); will wake the receiver."
              echo "skip=false" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::Unexpected PR state '$PR_STATE' for $BRANCH; failing closed (not waking receiver)."
              exit 1 ;;
          esac

      - name: Download VSIX and compute sha256
        id: sha
        if: steps.resolve.outputs.skip != 'true' && steps.guard.outputs.skip != 'true'
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # Compute the integrity anchor the receiver expects in the payload, exactly
          # as the monorepo's push would have supplied it. The receiver re-downloads
          # and re-verifies this (and the SLSA provenance) independently — this value
          # is the "expected", not the source of trust.
          gh release download "$TAG" \
            --repo "$EXPECTED_MONOREPO" \
            --pattern '*.vsix' \
            --dir /tmp/vsix
          COUNT=$(ls /tmp/vsix/*.vsix 2>/dev/null | wc -l | tr -d ' ')
          [ "$COUNT" -eq 1 ] || { echo "::error::expected exactly one .vsix on ${EXPECTED_MONOREPO}@${TAG}, found $COUNT"; exit 1; }
          VSIX=$(ls /tmp/vsix/*.vsix)
          SHA=$(sha256sum "$VSIX" | awk '{print $1}')
          echo "::notice::VSIX sha256: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Wake the receiver (fire repository_dispatch to self)
        if: steps.resolve.outputs.skip != 'true' && steps.guard.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          TAG: ${{ steps.resolve.outputs.tag }}
          VSIX_SHA256: ${{ steps.sha.outputs.sha }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          set -euo pipefail
          RELEASE_URL="${SERVER_URL}/${EXPECTED_MONOREPO}/releases/tag/${TAG}"

          # Build the SAME client_payload shape the monorepo push would send, so
          # receive-monorepo-release.yml handles it via one unchanged code path.
          # jq --arg is injection-safe; POST via stdin.
          jq -n \
            --arg version "$VERSION" \
            --arg repo "$EXPECTED_MONOREPO" \
            --arg tag "$TAG" \
            --arg url "$RELEASE_URL" \
            --arg sha "$VSIX_SHA256" \
            '{
              event_type: "monorepo-vsx-release",
              client_payload: {
                version: $version,
                monorepo_repo: $repo,
                monorepo_tag: $tag,
                release_url: $url,
                vsix_sha256: $sha
              }
            }' \
          | gh api "repos/${THIS_REPO}/dispatches" --method POST --input -

          echo "::notice::Dispatched monorepo-vsx-release for ${TAG} to ${THIS_REPO}"
