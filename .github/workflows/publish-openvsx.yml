name: Publish to Open VSX Registry

on:
  release:
    types: [released]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish (e.g. b2c-vs-extension@0.8.2). Leave empty to use the latest release.'
        required: false
        type: string

jobs:
  publish:
    name: Publish VSIX to Open VSX Registry
    runs-on: ubuntu-latest
    environment: publish
    env:
      OVSX_PAT: ${{ secrets.IDEE_OVSX_PAT }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || 'lts/*' }}

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
          elif [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG=$(gh release list --repo "${{ github.repository }}" --limit 1 --json tagName --jq '.[0].tagName')
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Could not resolve a release tag to publish"
            exit 1
          fi
          echo "Publishing tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download VSIX from release
        id: download
        run: |
          gh release download "${{ steps.tag.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --pattern '*.vsix' \
            --dir .
          VSIX=$(ls *.vsix | head -n1)
          if [ -z "$VSIX" ]; then
            echo "::error::No .vsix asset found on release ${{ steps.tag.outputs.tag }}"
            exit 1
          fi
          echo "Downloaded VSIX: $VSIX"
          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      - name: Publish to Open VSX Registry
        run: |
          npx --yes ovsx publish \
            --skip-duplicate \
            -p "$OVSX_PAT" \
            "${{ steps.download.outputs.vsix }}"
