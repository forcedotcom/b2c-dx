name: Create release on merge

on:
  push:
    branches: [main]
    paths:
      - 'releases/latest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-on-merge
  cancel-in-progress: false

jobs:
  release:
    name: Create GitHub release from merged release PR
    runs-on: ubuntu-latest
    # The release job does NOT depend on ctc-open. CTC runs in parallel / observational.
    # When CTC is disabled (the default), this job behaves exactly as before.
    permissions:
      contents: write # create the release + tag
      actions: write # trigger publish-vscode / publish-openvsx via workflow_dispatch
    outputs:
      release_tag: ${{ steps.marker.outputs.release_tag }}
      skip: ${{ steps.marker.outputs.skip }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Allowlisted source repo. Override via repo variable for sandbox testing.
      EXPECTED_MONOREPO: ${{ vars.EXPECTED_MONOREPO || 'SalesforceCommerceCloud/b2c-developer-tooling' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - name: Read release marker
        id: marker
        run: |
          set -euo pipefail

          if [ ! -f releases/latest.json ]; then
            echo "::error::releases/latest.json is missing"
            exit 1
          fi

          VERSION=$(jq -r '.version // empty' releases/latest.json)
          MONOREPO_TAG=$(jq -r '.monorepoTag // empty' releases/latest.json)
          MONOREPO_REPO=$(jq -r '.monorepoRepo // empty' releases/latest.json)
          VSIX_SHA256=$(jq -r '.vsixSha256 // empty' releases/latest.json)

          if [ -z "$VERSION" ] || [ -z "$MONOREPO_TAG" ] || [ -z "$MONOREPO_REPO" ]; then
            echo "::notice::releases/latest.json has null version/tag/repo (sentinel state); nothing to release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Allowlist the source repo (defense in depth; the marker is written by
          # the receiver, but re-check at the gate that actually creates the release).
          if [ "$MONOREPO_REPO" != "$EXPECTED_MONOREPO" ]; then
            echo "::error::marker monorepoRepo '$MONOREPO_REPO' is not the allowlisted '$EXPECTED_MONOREPO'"
            exit 1
          fi

          # Integrity anchor must be present and well-formed.
          echo "$VSIX_SHA256" | grep -Eq '^[a-f0-9]{64}$' \
            || { echo "::error::marker vsixSha256 is missing or malformed"; exit 1; }

          # Skip if version is unchanged from the previous commit (e.g. metadata-only edits).
          PREV=$(git show HEAD~1:releases/latest.json 2>/dev/null | jq -r '.version // empty' || true)
          if [ "$PREV" = "$VERSION" ]; then
            echo "::notice::Version unchanged ($VERSION); nothing to release"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          RELEASE_TAG="b2c-vs-extension@${VERSION}"

          # Idempotency: skip if the release already exists in this repo.
          if gh release view "$RELEASE_TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "::notice::Release $RELEASE_TAG already exists; skipping"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "version=$VERSION"
            echo "release_tag=$RELEASE_TAG"
            echo "monorepo_tag=$MONOREPO_TAG"
            echo "monorepo_repo=$MONOREPO_REPO"
            echo "vsix_sha256=$VSIX_SHA256"
            echo "skip=false"
          } >> "$GITHUB_OUTPUT"

      - name: Download VSIX from monorepo release
        if: steps.marker.outputs.skip != 'true'
        env:
          MONOREPO_TAG: ${{ steps.marker.outputs.monorepo_tag }}
          MONOREPO_REPO: ${{ steps.marker.outputs.monorepo_repo }}
        run: |
          set -euo pipefail
          gh release download "$MONOREPO_TAG" \
            --repo "$MONOREPO_REPO" \
            --pattern '*.vsix' \
            --dir .
          VSIX=$(ls *.vsix 2>/dev/null | head -n1)
          if [ -z "$VSIX" ]; then
            echo "::error::No .vsix asset found on ${MONOREPO_REPO}@${MONOREPO_TAG}"
            exit 1
          fi
          echo "Downloaded $VSIX"
          echo "VSIX=$VSIX" >> "$GITHUB_ENV"

      - name: Verify VSIX integrity (sha256) — fail closed
        if: steps.marker.outputs.skip != 'true'
        env:
          EXPECTED_SHA: ${{ steps.marker.outputs.vsix_sha256 }}
        run: |
          set -euo pipefail
          ACTUAL_SHA=$(sha256sum "$VSIX" | awk '{print $1}')
          if [ "$ACTUAL_SHA" != "$EXPECTED_SHA" ]; then
            echo "::error::VSIX sha256 mismatch. expected=$EXPECTED_SHA actual=$ACTUAL_SHA"
            exit 1
          fi
          echo "::notice::VSIX sha256 verified: $ACTUAL_SHA"

      - name: Verify build provenance (SLSA attestation) — trust anchor, fail closed
        if: steps.marker.outputs.skip != 'true'
        env:
          MONOREPO_REPO: ${{ steps.marker.outputs.monorepo_repo }}
        run: |
          set -euo pipefail
          # This is the machine check that compensates for the human PR review
          # (which only sees metadata). A tampered or foreign VSIX cannot reach
          # release creation — and therefore cannot reach the marketplaces.
          # --source-ref pins the git ref so only artifacts built+attested from
          # the monorepo's main branch pass (see receive-monorepo-release.yml).
          gh attestation verify "$VSIX" \
            --repo "$MONOREPO_REPO" \
            --signer-workflow "${MONOREPO_REPO}/.github/workflows/publish.yml" \
            --source-ref refs/heads/main

      - name: Extract changelog section for release notes
        if: steps.marker.outputs.skip != 'true'
        env:
          VERSION: ${{ steps.marker.outputs.version }}
          MONOREPO_REPO: ${{ steps.marker.outputs.monorepo_repo }}
          MONOREPO_TAG: ${{ steps.marker.outputs.monorepo_tag }}
        run: |
          set -euo pipefail
          awk '
            /^## / { if (found) exit; found=1; next }
            found { print }
          ' CHANGELOG.md > /tmp/release-notes.md
          {
            printf '## B2C DX VS Code Extension v%s\n\n' "$VERSION"
            printf 'Source release: [%s@%s](https://github.com/%s/releases/tag/%s)\n\n' \
              "$MONOREPO_REPO" "$MONOREPO_TAG" "$MONOREPO_REPO" "$MONOREPO_TAG"
            printf 'Install via:\n```\ncode --install-extension b2c-vs-extension-%s.vsix\n```\n\n' "$VERSION"
            printf 'Or in VS Code: Extensions → ⋯ → Install from VSIX...\n\n---\n\n### Changelog\n\n'
            cat /tmp/release-notes.md
          } > /tmp/full-release-notes.md

      - name: Create release
        if: steps.marker.outputs.skip != 'true'
        env:
          RELEASE_TAG: ${{ steps.marker.outputs.release_tag }}
          VERSION: ${{ steps.marker.outputs.version }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            --repo "${{ github.repository }}" \
            --title "VS Code Extension ${VERSION}" \
            --notes-file /tmp/full-release-notes.md \
            "$VSIX"

      # A `release` event created with GITHUB_TOKEN does NOT trigger other workflows
      # (GitHub's recursion guard). workflow_dispatch is one of the two exceptions,
      # so explicitly dispatch the publishers and pass the tag. Each publisher
      # re-verifies the VSIX provenance before it touches a marketplace.
      - name: Trigger marketplace publish workflows
        if: steps.marker.outputs.skip != 'true'
        env:
          RELEASE_TAG: ${{ steps.marker.outputs.release_tag }}
        run: |
          set -euo pipefail
          gh workflow run publish-vscode.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f tag="$RELEASE_TAG"
          gh workflow run publish-openvsx.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f tag="$RELEASE_TAG"
          echo "::notice::Dispatched publish-vscode and publish-openvsx for $RELEASE_TAG"

  # ---------------------------------------------------------------------------
  # Change Traffic Control (CTC) — OPTIONAL, INERT BY DEFAULT.
  #
  # These two jobs open and close a change case for the release. They are a
  # reusable workflow owned by another org (salesforcecli/github-workflows),
  # SHA-pinned like every other external ref in this repo. The change case is
  # auto-approved / audit-only: ctcOpen creates the case and returns immediately
  # (it does NOT wait for human approval), so it adds an audit record without
  # slowing the release.
  #
  # Gating & safety (do not remove without understanding these):
  #   * Both jobs are gated by `vars.ENABLE_CTC == 'true'`. With the variable
  #     UNSET (the default), both jobs are SKIPPED and this workflow behaves
  #     exactly as it did before CTC was added — same release, same dispatch.
  #   * The `release` job does NOT depend on either CTC job, so CTC can never
  #     block or delay publishing. CTC depends on `release` (not the reverse):
  #     a case is only ever opened for a release that actually happened, and
  #     `if: needs.release.outputs.skip != 'true'` means a skipped/no-op run
  #     opens no case (so there is no orphaned, never-closed case).
  #   * A reusable-workflow call must be at the JOB level (not inside `steps:`);
  #     that is why these are standalone jobs that reuse the `release` job's
  #     existing `release_tag` output rather than re-deriving the version.
  #
  # Prerequisites before ENABLE_CTC can be flipped on (provisioned OUTSIDE this
  # repo, none are code): the secrets SF_CHANGE_CASE_SFDX_AUTH_URL,
  # SF_CHANGE_CASE_TEMPLATE_ID, SF_CHANGE_CASE_CONFIGURATION_ITEM (the CI value
  # depends on the extension's final publishing name, which is still pending),
  # plus access to the static-ip runner the reusable workflow pins.
  # ---------------------------------------------------------------------------
  ctc-open:
    name: Open CTC change case
    if: vars.ENABLE_CTC == 'true' && needs.release.outputs.skip != 'true'
    needs: release
    # Reusable workflow call at the JOB level (the only valid place for `uses:`
    # + `with:` + `secrets:`). githubTag is used only to build the case's
    # release URL, so the b2c-vs-extension@X.Y.Z tag scheme is fine as-is.
    uses: salesforcecli/github-workflows/.github/workflows/ctcOpen.yml@b2e6bd822a35e5b62b0f8246b12747e4fd806790
    with:
      githubTag: ${{ needs.release.outputs.release_tag }}
      nodeVersion: ${{ vars.NODE_VERSION || 'lts/*' }}
    secrets: inherit

  # Close the case after the release is created and the publishers are dispatched.
  # Trade-off (intentional, minimal-surgery): the case is closed once the release
  # exists and both publishers have been dispatched — NOT after the marketplaces
  # confirm the upload (those run async in separate workflow runs). True
  # open→publish→close tracking would need cross-workflow coordination; given the
  # case is audit-only, the few-minute gap is acceptable audit precision, not a
  # control gap. `if: always()` so the case is still closed if a publisher
  # dispatch step failed — an open case should not be left dangling.
  ctc-close:
    name: Close CTC change case
    if: always() && vars.ENABLE_CTC == 'true' && needs.ctc-open.result == 'success'
    needs: [ctc-open, release]
    uses: salesforcecli/github-workflows/.github/workflows/ctcClose.yml@b2e6bd822a35e5b62b0f8246b12747e4fd806790
    with:
      changeCaseId: ${{ needs.ctc-open.outputs.changeCaseId }}
      status: Implemented - per plan
      nodeVersion: ${{ vars.NODE_VERSION || 'lts/*' }}
    secrets: inherit
